<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankResume Photo Layout</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap');

        :root {
            --bg-color: {{ theme.bg_color }};
            --primary-text: {{ theme.primary_text }};
            --accent-color: {{ theme.accent_color }};
            --footer-bg: {{ theme.footer_bg }};
            --footer-text: {{ theme.footer_text }};
            --footer-accent: {{ theme.footer_accent }};
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1080px; height: 1350px;
            /* The background image is injected here */
            background-image: url('{{ bg_image_url }}');
            background-size: cover;
            background-position: center;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            display: flex; flex-direction: column;
            color: white; /* Text is white on dark overlay */
        }

        /* Gradient Overlay to make text readable */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.95) 100%);
            z-index: 1;
        }

        /* All content sits above overlay */
        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            padding: 50px 60px;
        }

        /* Top Header */
        .header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 40px;}
        .brand-name { font-size: 50px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .brand-name span { color: var(--accent-color); /* Consistent gold accent */ }
        .subtitle { font-size: 16px; letter-spacing: 4px; text-transform: uppercase; margin-top: 10px; opacity: 0.8; font-weight: 600; }

        /* Bottom Content Area */
        .bottom-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .headline-group { margin-bottom: 20px; }
        .headline { 
            font-family: 'Playfair Display', serif; 
            font-size: 65px; 
            font-weight: 900; 
            line-height: 1.1; 
            text-transform: uppercase; 
            margin-bottom: 20px;
        }
        .subheadline { 
            font-size: 26px; 
            font-weight: 600; 
            line-height: 1.4; 
            opacity: 0.95; 
        }

        .bullets {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .bullet-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            font-size: 24px;
            line-height: 1.4;
        }
        
        .bullet-item i {
            color: var(--accent-color);
            font-size: 20px;
            margin-top: 6px;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 25px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .footer-brand { text-transform: uppercase; }
        .footer-url { display: flex; align-items: center; gap: 10px; }
        .footer-url i { font-size: 28px; }

    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="content-wrapper">
        <div class="header">
            <div class="brand-name">RANK<span>RESUME</span></div>
            <div class="subtitle">Premium Career Insights</div>
        </div>

        <div class="bottom-content">
            <div class="headline-group">
                <div class="headline">{{ headline }}</div>
                <div class="subheadline">{{ subheadline }} <span style="color: #d4af37;">{{ highlight_text }}</span></div>
            </div>

            <div class="bullets">
                <div class="bullet-item">
                    <i class="fa-solid fa-circle"></i>
                    <span>{{ bullet_1_title }} - {{ bullet_1_text }}</span>
                </div>
                <div class="bullet-item">
                    <i class="fa-solid fa-circle"></i>
                    <span>{{ bullet_2_title }} - {{ bullet_2_text }}</span>
                </div>
                <div class="bullet-item">
                    <i class="fa-solid fa-circle"></i>
                    <span>{{ bullet_3_title }} - {{ bullet_3_text }}</span>
                </div>
            </div>

            <div class="footer">
                <div class="footer-brand">RANKRESUME_PRO</div>
                <div class="footer-url">
                    <span>WWW.RANKRESUME.PRO</span>
                    <i class="fa-solid fa-hand-pointer"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
